<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Gradient principal du logo (cyan → bleu → violet → magenta → orange) -->
    <linearGradient id="grad-main" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="80%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Gradient pour la fleche (magenta → orange) -->
    <linearGradient id="grad-arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Gradient pour le cercle -->
    <linearGradient id="grad-circle" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
  </defs>

  <!-- Arc circulaire (ouvert en haut a droite) -->
  <path d="M 155 55 A 75 75 0 1 0 155 145" stroke="url(#grad-circle)" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- W lettermark forme par 3 barres ascendantes -->
  <!-- Barre gauche -->
  <rect x="52" y="95" width="16" height="50" rx="3" fill="url(#grad-main)"/>
  <!-- Barre centre -->
  <rect x="78" y="75" width="16" height="70" rx="3" fill="url(#grad-main)"/>
  <!-- Barre droite (la plus haute) -->
  <rect x="104" y="55" width="16" height="90" rx="3" fill="url(#grad-main)"/>

  <!-- Lignes du W (descendantes entre les barres) -->
  <path d="M 52 145 L 68 130 L 78 145 L 94 125 L 104 145 L 120 110" stroke="url(#grad-main)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fleche ascendante -->
  <path d="M 120 95 L 140 50" stroke="url(#grad-arrow)" stroke-width="7" stroke-linecap="round"/>
  <polygon points="132,42 148,40 142,56" fill="url(#grad-arrow)"/>
</svg>
