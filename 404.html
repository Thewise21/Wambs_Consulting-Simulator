<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Der Simulator ist umgezogen — WAMB'S Consulting</title>

<!-- Suchmaschinen: diese Adresse nicht mehr fuehren, die neue zaehlt. -->
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://www.wambsconsulting.de/simulator/">

<!-- Fallback ohne JavaScript. Die Sekunde reicht, damit der Hinweis
     kurz lesbar ist; mit JavaScript geht es sofort und behaelt dabei
     die Vertiefung (#/steuer o. ae.) aus dem Lesezeichen. -->
<noscript><meta http-equiv="refresh" content="1;url=https://www.wambsconsulting.de/simulator/"></noscript>

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{ --ink:#111A24; --paper:#F4F1EA; --gold:#A8853B; --muted:#4A5563 }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ink);color:var(--paper);
    font:400 17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid;place-items:center;padding:24px;text-align:center}
  .kasten{max-width:34rem}
  .marke{font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold);margin:0 0 22px}
  h1{font-size:clamp(25px,4vw,38px);line-height:1.2;margin:0 0 14px;font-weight:600}
  p{margin:0 0 26px;color:#C9C4BA}
  /* Die 44px sind Absicht: das hier ist auf dem Telefon oft der einzige
     Weg weiter, wenn JavaScript blockiert ist. */
  a.weiter{display:inline-flex;align-items:center;justify-content:center;
    min-height:44px;padding:0 26px;border:1px solid var(--gold);
    color:var(--paper);text-decoration:none;border-radius:2px}
  a.weiter:hover{background:var(--gold);color:var(--ink)}
  .klein{margin-top:26px;font-size:14px;color:#8E8880}
</style>
</head>
<body>
  <div class="kasten">
    <p class="marke">WAMB&#39;S Consulting</p>
    <h1>Der Simulator ist umgezogen.</h1>
    <p>Sie finden ihn jetzt mit allen Rechnern direkt auf unserer Website.
       Bitte aktualisieren Sie Ihr Lesezeichen.</p>
    <p><a class="weiter" href="https://www.wambsconsulting.de/simulator/">Zum Simulator</a></p>
    <p class="klein">Le simulateur a déménagé · The calculator has moved<br>
       wambsconsulting.de/simulator</p>
  </div>

<script>
  /* Vertiefung und Parameter mitnehmen: wer #/steuer im Lesezeichen hat,
     landet auch dort. Kennt der neue Simulator eine alte Kennung nicht,
     zeigt er die Uebersicht — kein Fehler, nur ein Schritt zurueck.
     replace() statt href, damit der Zurueck-Knopf nicht in einer
     Schleife zwischen alter und neuer Adresse haengen bleibt. */
  (function () {
    var ziel = 'https://www.wambsconsulting.de/simulator/';
    try { ziel += (location.search || '') + (location.hash || ''); } catch (e) {}
    location.replace(ziel);
  })();
</script>
</body>
</html>
